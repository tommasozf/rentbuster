# RentBuster — full-stack setup
#
# Quick start:
#   cp .env.example .env   # fill in API keys / webhooks
#   docker compose up -d   # starts db + rentbuster (schema is created automatically)
#   docker compose logs -f rentbuster
#
# With dashboard: docker compose --profile dashboard up -d
#
# The dashboard is bound to 127.0.0.1 by default so it is NOT reachable from the public
# internet even if you expose the host. Wrap in a reverse proxy with auth for remote access.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentbuster}
      POSTGRES_USER: ${POSTGRES_USER:-rentbuster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentbuster}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rentbuster-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentbuster} -d ${POSTGRES_DB:-rentbuster}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rentbuster:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rentbuster}:${POSTGRES_PASSWORD:-rentbuster}@db:5432/${POSTGRES_DB:-rentbuster}
    # Chromium needs more than Docker's 64MB default /dev/shm or it crashes with OOM errors.
    shm_size: 2g

  dashboard:
    profiles: [dashboard]
    build:
      context: ./dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rentbuster}:${POSTGRES_PASSWORD:-rentbuster}@db:5432/${POSTGRES_DB:-rentbuster}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  rentbuster-db:
