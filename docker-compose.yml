# RentBuster — full-stack local setup
#
# Basic:   docker compose up               # starts db + rentbuster
# With dashboard: docker compose --profile dashboard up
# First-time schema init: docker compose run --rm rentbuster python -m rentbuster init-db
#
# The dashboard is bound to 127.0.0.1 by default so it is NOT reachable from the public
# internet even if you expose the host. Wrap in a reverse proxy with auth for remote access.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentbuster}
      POSTGRES_USER: ${POSTGRES_USER:-rentbuster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentbuster}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rentbuster-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentbuster} -d ${POSTGRES_DB:-rentbuster}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rentbuster:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rentbuster}:${POSTGRES_PASSWORD:-rentbuster}@db:5432/${POSTGRES_DB:-rentbuster}
    # Playwright needs a display shim for headless Chromium in some environments
    # shm_size: 2g  # uncomment if Chromium crashes with OOM errors

  dashboard:
    profiles: [dashboard]
    build:
      context: ./dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rentbuster}:${POSTGRES_PASSWORD:-rentbuster}@db:5432/${POSTGRES_DB:-rentbuster}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  rentbuster-db:
