name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Ruff lint
        run: uv run ruff check rentbuster tests
      - name: Ruff format check
        run: uv run ruff format --check rentbuster tests
      - name: Tests
        run: uv run pytest -q
