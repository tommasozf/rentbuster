name: amsterdam
description: Find bustable apartments in Amsterdam where asking rent exceeds the legal WWS maximum.
search:
  city: amsterdam
  max_rent: 3500
  min_size: 0
  max_rooms: 4
  property_types: [apartment, studio]
  pararius_max_pages: 15
  rentbuster_nl_max_pages: 23
  must_allow_students: true
  must_allow_sharing: true
  must_accept_guarantor: true
wws:
  bustable_only: true
  min_savings: 50
  require_rb_agreement: false   # true = only alert when rent-buster.nl also calls it bustable
  # Used when the ad gives no detail (and no LLM extraction). Standard Amsterdam apartment:
  default_outdoor_points: 2       # presence bonus (most apartments have a small balcony)
  default_kitchen_points: 10      # counter 4 + faucet 1 + drain 1 + cooker 4
  default_bathroom_points: 12     # toilet 3 + shower 4 + basin 1 + bath 3 + extras 1
  default_heating_points: 2       # per heated room
