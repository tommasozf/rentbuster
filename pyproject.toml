[project]
name = "rentbuster"
version = "2.0.0"
description = "Dutch rent-busting tool: scrape Pararius + rent-buster.nl, calculate WWS points, notify on bustable listings."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "discord-webhook>=1.3,<2",
    "apprise>=1.9,<2",
    "playwright>=1.40,<2",
    "playwright-stealth>=2.0,<3",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0,<2"]
dev = ["ruff>=0.6,<1", "pytest>=8,<10", "pytest-asyncio>=0.23,<1"]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rentbuster"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line too long (ruff format handles layout)
    "B008",  # function calls in defaults (fine for pydantic Field(...))
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"
